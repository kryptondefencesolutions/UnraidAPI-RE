name: Release

# Every merge to master publishes the image Unraid runs: paulsmithcruk/unraidapi-re:latest, plus
# :sha-<commit> to roll back to. Version branches (e.g. 7.3) publish :<branch>.
on:
  push:
    branches: [master, '*.*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tags
        run: |
          image=paulsmithcruk/unraidapi-re
          if [ "${GITHUB_REF_NAME}" = master ]; then
            echo "tags=${image}:latest,${image}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
